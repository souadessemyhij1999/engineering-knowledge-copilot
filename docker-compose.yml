# docker compose up --build   ->  http://localhost:8000
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      COPILOT_QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/copilot
      COPILOT_JWT_SECRET: ${COPILOT_JWT_SECRET:-please-change-this-to-a-long-random-string}
      COPILOT_ANSWER_MODE: ${COPILOT_ANSWER_MODE:-extractive}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_data:
  pg_data:
