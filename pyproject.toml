[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-knowledge-copilot"
version = "1.0.0"
description = "RAG assistant for technical PDFs, work instructions, quality reports and regulations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Souad Essemyhij" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "qdrant-client>=1.12",
  "wordllama>=0.3",
  "pdfplumber>=0.11",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-anthropic>=0.3",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "PyJWT>=2.8",
  "PyYAML>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0", "pandas>=2.0", "matplotlib>=3.8", "ruff>=0.5",
       "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copilot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 132
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["copilot", "conftest", "evaluate"]
