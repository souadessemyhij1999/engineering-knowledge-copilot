name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check src scripts tests
      - run: pytest
      - name: offline evaluation
        run: python scripts/evaluate.py > /dev/null && head -40 reports/metrics.json

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: start the stack
        run: docker compose up -d --build
      - name: wait for the API
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 3; done
          docker compose ps
          docker compose logs api
          # last log lines as an annotation, so they show up on the run summary page
          echo "::error title=api logs::$(docker compose logs --no-color --tail 25 api | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          exit 1
      - name: smoke test against Qdrant + Postgres
        run: |
          TOKEN=$(curl -s -X POST localhost:8000/auth/token -d "username=olga.operator&password=demo" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -s -X POST localhost:8000/ask -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
               -d '{"question":"What torque for the M10 flange bolts?"}' | tee answer.json
          grep -q "45 Nm" answer.json
          docker compose exec -T postgres psql -U copilot -c "select count(*) from query_log;"
      - if: always()
        run: docker compose down -v
